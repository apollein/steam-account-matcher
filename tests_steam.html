<!DOCTYPE html>
<html>
<head>
<style>
body {
  font-family: 'Helvetica', 'Arial', sans-serif;
}
br {
   display: block;
   margin: 10px 0;
}
.content {
  position: absolute;
  left: 50%;
  top: 50%;
  -webkit-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  text-align: center;
}
</style>
</head>
<body>
<div class="content">
<b>Both Steam accounts should be set to public!</b><br />
<form>
<div id="input-1">URL steam 1  <input type="text" required id="id1" size="42"/><br /></div>
<div id="input-2">URL steam 2  <input type="text" required id="id2" size="42"/><br /></div>
<button>Let's try lol</button>
<div id="result">
</div>
</form>
</div>
<script>
function hash(id1, id2) {
  let hash = 0;
  for (const char of id1) {
    hash = (hash << 5) - hash + char.charCodeAt(0);
    hash |= 0;
  }
  for (const char of id2) {
    hash = (hash << 5) - hash + char.charCodeAt(0);
    hash |= 0;                              
  }
  return Math.abs(hash);
}

const button = document.querySelector("button");
const result = document.getElementById("result");
const first = document.getElementById("id1");
const second = document.getElementById("id2");
button.addEventListener("click", (event) => {
  event.preventDefault();
  const re = new RegExp("https:\\/\\/steamcommunity\\.com\\/(id|profiles)\\/(\\w*)\\/?");
  let _first = re.exec(first.value)[2];
  let _second = re.exec(second.value)[2];
  let _key = hash(_first, _second).toString();
  result.innerHTML="loading!";
  let url = "https://vapeur.ellana.eu/meow/"+_first+"/"+_second+"/"+_key;
  console.log(url);
  fetch(url).then(response => {
  return response.json();
}).then(data => {
  // Work with JSON data here
  score = data.score * 100;
  result.innerHTML="score:"+score+"%";;
}).catch(err => {
  // Do something for an error here
});
});
</script>
</body>
</html>
